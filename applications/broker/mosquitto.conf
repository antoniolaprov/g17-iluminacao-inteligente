# Broker MQTT local do Grupo 17 (Mosquitto 2.x)
#
# 1883: MQTT "puro", usado pelo ESP32, pelo coletor, pelo simulador e pelo ML.
# 9001: MQTT sobre WebSocket, usado pelo dashboard no navegador.
#
# Sem endereço no "listener", o Mosquitto escuta em IPv4 e IPv6 ao mesmo tempo
# (requisito de IPv6 da disciplina: teste com o cliente apontando para [::1] ou
# para o IPv6 do PC na rede local).

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Só para a rede local da demonstração. Num poste de verdade isso exigiria
# usuário/senha (password_file) e TLS.
allow_anonymous true
