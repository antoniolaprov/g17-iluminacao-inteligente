# Mosquitto local + ponte com o broker público (HiveMQ).
#
# Para a maquete: a placa (P01) continua publicando no broker.hivemq.com, como está gravada, e
# a ponte traz as mensagens dela para o Mosquitto local e leva de volta só o que é para ela
# (comando, rota e risco). Assim tudo no PC (coletor, ML, dashboard) usa o broker local, sem
# regravar o firmware. Uso: MOSQUITTO_CONF=mosquitto-ponte.conf docker compose up -d
#
# As direções são separadas por tópico de propósito: o HiveMQ público não entende a marcação de
# ponte do Mosquitto, e com "both" uma mensagem iria e voltaria em loop.
# Não rode o P01 simulado (SIM_INCLUIR_P01=1) junto com a ponte: seriam dois P01.

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

connection ponte-hivemq
address broker.hivemq.com:1883
cleansession true
try_private false
notifications false
restart_timeout 5 30
# placa -> PC
topic g17/poste/P01/telemetria in 0
topic g17/poste/P01/status in 1
topic g17/poste/P01/evento in 1
topic g17/poste/P01/travessia in 1
# PC -> placa
topic g17/poste/P01/comando out 1
topic g17/poste/P01/rota out 1
topic g17/poste/P01/risco out 1
